services:
  - type: web
    name: aara-vanchanakan
    runtime: node
    plan: free
    region: singapore
    buildCommand: tar -xzf game-source.tar.gz && npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
